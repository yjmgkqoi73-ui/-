<!doctype html>
<html lang="zh-Hant">
<head>

<title>博客來閱讀好生活｜活動資訊</title>
<style>
:root{--green:#17683b;--lime:#91c900;--cream:#fbf9e9;--ink:#173d2b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#f7f9e8,#fffdf5);color:var(--ink)}
header{padding:18px 18px 14px;text-align:center;background:#fffef5;border-bottom:1px solid #e6edcf;position:sticky;top:0;z-index:2}header .brand{font-weight:900;font-size:clamp(21px,4vw,30px);color:var(--green);letter-spacing:.04em}header .sub{font-size:13px;color:#54745d;margin-top:3px}
main{width:min(980px,100%);margin:auto;padding:18px 14px 34px}.hero{padding:26px 18px 24px;border-radius:24px;background:radial-gradient(circle at 85% 5%,#e6f6a9 0,transparent 35%),linear-gradient(135deg,#fffef7,#eef8d4);text-align:center;box-shadow:0 12px 35px #254a1810;border:1px solid #e3edc8}.pill{display:inline-block;padding:7px 14px;border-radius:99px;background:#e4f4b6;color:#32651e;font-size:13px;font-weight:800}.hero h1{font-size:clamp(27px,6vw,44px);line-height:1.25;margin:15px 0 10px;color:#145a34}.hero p{margin:0 auto 20px;line-height:1.8;max-width:600px;color:#4c6a51}.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:linear-gradient(135deg,#8dc900,#61a900);color:#fff;font-size:18px;font-weight:900;padding:15px 28px;border-radius:999px;box-shadow:0 7px 0 #397b16,0 12px 24px #75a90030;transition:transform .15s}.cta:hover{transform:translateY(-2px)}.cta:focus-visible{outline:3px solid #173d2b;outline-offset:4px}.hint{font-size:12px!important;margin:14px 0 0!important;color:#647c60!important}.section-title{text-align:center;margin:30px 0 16px;font-size:23px;color:var(--green)}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gallery img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid #e2e9d0;box-shadow:0 5px 18px #274b1710;background:white}.bottom-cta{text-align:center;padding:24px 10px 8px}.notice{font-size:12px;line-height:1.7;color:#6e7968;text-align:center;margin:20px auto 0;max-width:720px;padding:13px 16px;border-top:1px solid #e2e8d5}footer{text-align:center;padding:16px;font-size:12px;color:#788573}
@media(max-width:620px){main{padding:12px 10px 24px}.hero{padding:23px 15px;border-radius:18px}.gallery{grid-template-columns:1fr;gap:12px}.section-title{font-size:21px}.cta{width:min(100%,340px)}}
</style>
</head>
<body>
<header><div class="brand">📚 博客來・閱讀好生活</div><div class="sub">精選閱讀與生活靈感｜活動資訊頁</div></header>

</main><footer>© 閱讀好生活・活動資訊導覽</footer>
